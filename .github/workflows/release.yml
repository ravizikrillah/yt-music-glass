name: Build & Release All Desktop Platforms

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift tests
        run: make test
      - name: Build Apple Silicon DMG (macOS 13.0+)
        env:
          YTMG_VERSION: ${{ github.ref_name }}
        run: |
          YTMG_VERSION="${GITHUB_REF_NAME#v}" make dmg-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist-macos/YT-Music-Glass-macOS-arm64.dmg

  build-macos-x86_64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Intel DMG (macOS 13.0+)
        run: |
          YTMG_VERSION="${GITHUB_REF_NAME#v}" make dmg-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: dist-macos/YT-Music-Glass-macOS-x86_64.dmg

  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install & test desktop core
        working-directory: apps/desktop
        run: |
          npm install
          cargo test --manifest-path src-tauri/Cargo.toml
          npm run tauri build -- --bundles nsis
      - name: Package Windows NSIS & Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-windows | Out-Null
          $exe = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist-windows/YT-Music-Glass-Windows-x64-Setup.exe
          Compress-Archive -Path apps/desktop/src-tauri/target/release/yt-music-glass-desktop.exe -DestinationPath dist-windows/YT-Music-Glass-Windows-x64-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist-windows/*

  build-desktop-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebKitGTK & bundling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf fuse libfuse2
      - name: Build AppImage & deb
        working-directory: apps/desktop
        run: |
          npm install
          cargo test --manifest-path src-tauri/Cargo.toml
          npm run tauri build -- --bundles appimage,deb
      - name: Collect Linux artifacts
        run: |
          mkdir -p dist-linux
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist-linux/YT-Music-Glass-Linux-x86_64.AppImage
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb dist-linux/YT-Music-Glass-Linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: dist-linux/*

  publish-release:
    needs:
      - build-macos-arm64
      - build-macos-x86_64
      - build-desktop-windows
      - build-desktop-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build structured release notes
        run: node .github/scripts/release-notes.mjs "${GITHUB_REF_NAME}" /tmp/release-notes.md
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: YT Music Glass ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          files: release-assets/*
