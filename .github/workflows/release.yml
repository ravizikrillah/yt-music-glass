name: Build & Release macOS DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-dmg:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set bundle version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          sed -i '' "s|<string>1.0.0</string>|<string>${TAG_VER}</string>|g" scripts/build.sh

      - name: Run Swift unit tests
        run: make test

      - name: Build YT Music Glass DMG (Apple Silicon)
        run: make dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-macos/YT-Music-Glass-macOS-*.dmg
