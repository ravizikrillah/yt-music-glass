[package]
name = "yt-music-glass-desktop"
version = "1.2.0"
description = "Lightweight native WebView2/WebKitGTK desktop client for YouTube Music & YouTube"
authors = ["Ravi Bangkit Nur Zikrillah"]
edition = "2021"

[lib]
name = "yt_music_glass_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
whatlang = "0.16"
regex = "1"
once_cell = "1"
dirs = "5"
chrono = "0.4"
urlencoding = "2"
